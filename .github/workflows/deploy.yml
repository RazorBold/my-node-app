name: Auto Deploy to VM

on:
  push:
    branches:
      - main   # Trigger setiap push ke main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT }}
          script: |
            cd /home/ipul/my-node-app
            git pull origin main

            # Build Docker image terbaru
            docker build -t my-node-app:latest .

            # Stop & remove container lama jika ada
            OLD_CONTAINER=$(docker ps -q -f name=my-node-app-container)
            if [ "$OLD_CONTAINER" ]; then
              docker stop $OLD_CONTAINER
              docker rm $OLD_CONTAINER
            fi

            # Jalankan container baru langsung
            docker run -d -p 5028:5028 --name my-node-app-container my-node-app:latest